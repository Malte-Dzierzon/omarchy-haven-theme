# ------------------------------------------------------------
# Image picker
# ------------------------------------------------------------

[image-picker]
scrim = "#04070b"
scrim-alpha = 0.55

text = "#e9efeb"

selected-border = "#97a6bb"
selected-border-alpha = 0.95

unselected-border = "#e9efeb"
unselected-border-alpha = 0.22
