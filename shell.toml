```toml
# Haven — Omarchy Quattro shell
# Sharp, restrained, atmospheric.
#
# Palette comes from colors.toml.
# This file defines shell-specific surface, state and spacing behavior.


# ------------------------------------------------------------
# Bar
# ------------------------------------------------------------

[bar]
background = "#070e15"
background-alpha = 0.92
text = "#e9efeb"
active = "#bfae87"
scale-with-font = true
size-horizontal = 24
size-vertical = 28


# ------------------------------------------------------------
# Hyprland integration
# ------------------------------------------------------------

[hyprland]
active-border = "#97a6bb"
active-border-foreground = "#e9efeb"


# ------------------------------------------------------------
# Shared controls
# ------------------------------------------------------------

[controls]
normal-color = "#e9efeb"
normal-fill-alpha = 0.02
normal-border = "#62676c"
normal-border-width = 1
normal-border-alpha = 0.20

hover-cursor-color = "#83a2a3"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#83a2a3"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.50

focus-color = "#bfae87"
focus-fill-alpha = 0.10
focus-border = "#bfae87"
focus-border-width = 1
focus-border-alpha = 0.72

selected-color = "#83a2a3"
selected-fill-alpha = 0.13
selected-border = "#83a2a3"
selected-border-width = 1
selected-border-alpha = 0.58

pressed-color = "#bfae87"
pressed-fill-alpha = 0.17

selection-color = "#83a2a3"
selection-fill-alpha = 0.28


# ------------------------------------------------------------
# Spacing
# ------------------------------------------------------------

[spacing]
scale = 1.0
scale-with-font = true

xs = 3
md = 4

control-padding-y = 8
panel-padding = 10


# ------------------------------------------------------------
# Typography
# ------------------------------------------------------------

[font]
base-size = 12
heading = 14
icon-large = 18


# ------------------------------------------------------------
# Popups / dropdowns
# ------------------------------------------------------------

[popups]
background = "#050b10"
background-alpha = 0.98
text = "#e9efeb"
border = "#97a6bb"
border-alpha = 0.55
border-width = 1


# ------------------------------------------------------------
# Tooltips
# ------------------------------------------------------------

[tooltip]
background = "#070e15"
background-alpha = 0.97
text = "#e9efeb"
border = "#62676c"
border-alpha = 0.75
border-width = 1


# ------------------------------------------------------------
# Notifications
# ------------------------------------------------------------

[notifications]
background = "#070e15"
background-alpha = 0.98
text = "#e9efeb"
border = "#62676c"
border-alpha = 0.85
border-width = 1
countdown = "#bfae87"


# ------------------------------------------------------------
# Launcher
# ------------------------------------------------------------

[launcher]
background = "#070e15"
background-alpha = 0.94
text = "#e9efeb"

border = "#97a6bb"
border-alpha = 0.55
border-width = 1

scrim = "#04070b"
scrim-alpha = 0.12

selected-background = "#83a2a3"
selected-background-alpha = 0.14
selected-text = "#f3f7f3"

selected-border = "#bfae87"
selected-border-alpha = 0.65
selected-border-width = 1


# ------------------------------------------------------------
# Menu
# ------------------------------------------------------------

[menu]
background = "#070e15"
