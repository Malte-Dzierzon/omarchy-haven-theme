border-alpha = 0.55
border-width = 1

scrim = "#04070b"
scrim-alpha = 0.12

selected-background = "#83a2a3"
selected-background-alpha = 0.14
selected-text = "#f3f7f3"

selected-border = "#bfae87"
selected-border-alpha = 0.65
selected-border-width = 1


# ------------------------------------------------------------
# Polkit
# ------------------------------------------------------------

[polkit]
background = "#050b10"
background-alpha = 0.98

text = "#e9efeb"
text-error = "#bfae87"

border = "#97a6bb"
border-error = "#bfae87"
border-alpha = 0.85
